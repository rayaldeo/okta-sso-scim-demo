name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Vulnerability check
        # Fails on any reachable vulnerability not listed in
        # .github/govulncheck-reviewed.txt (each entry records why it's safe).
        # The plain-text report is printed first for the log.
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... || true
          go run golang.org/x/vuln/cmd/govulncheck@latest -format json ./... > govulncheck.json
          go run ./tools/vulngate .github/govulncheck-reviewed.txt < govulncheck.json
